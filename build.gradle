plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = 'com.opcua.automation.server.MiniFactoryServer'
}

tasks.register('scenario', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.opcua.automation.client.MiniFactoryScenario'
}

group = 'com.opcua.automation'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {

    // Eclipse Milo OPC UA Server
    implementation 'org.eclipse.milo:milo-sdk-server:1.1.6'

    // Eclipse Milo OPC UA Client
    implementation 'org.eclipse.milo:milo-sdk-client:1.1.6'

    // TestNG
    testImplementation 'org.testng:testng:7.11.0'
}

test {
    useTestNG()
}
